specVersion: v0.1.0
package:
  name: "solana_transfers"
  version: v0.1.0

imports:
  solana: https://github.com/streamingfast/substreams-solana/releases/download/v0.1.0/solana-v0.1.0.spkg

protobuf:
  files:
    - transfers.proto
  importPaths:
    - ./proto

modules:
  - name: map_transfers
    kind: map
    initialBlock: 385870151
    inputs:
      - map: solana.block
    output:
      type: proto:solana.transfers.v1.Transfers

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/solana_transfers.wasm